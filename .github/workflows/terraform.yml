name: Terraform Pipeline

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_FILE: dev.tfvars
  TF_BACKEND_FILE: backend-dev.hcl

jobs:
  # ---------------------------------------------------------------------------
  # 1. Work out which root modules (vpc/, iam/, gke/) actually need to run.
  #    - A change under gke-platform/modules/ (shared child modules) affects
  #      all three, since vpc/, iam/, and gke/ all call into modules/.
  #    - A change under gke-platform/vpc/, iam/, or gke/ only affects that
  #      one root module.
  # ---------------------------------------------------------------------------
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.filter.outputs.components }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect changed root modules
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running on PR"
            git fetch origin ${{ github.base_ref }} --depth=1
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            echo "Running on push"
            BASE="HEAD~1"
            HEAD="HEAD"
          fi

          echo "Diff range: $BASE $HEAD"
          CHANGED=$(git diff --name-only $BASE..$HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"

          COMPONENTS="[]"

          if echo "$CHANGED" | grep -q "^gke-platform/modules/"; then
            echo "Shared module changed - all root modules must run"
            COMPONENTS='["vpc","iam","gke"]'
          else
            if echo "$CHANGED" | grep -q "^gke-platform/vpc/"; then
              COMPONENTS=$(echo "$COMPONENTS" | jq -c '. + ["vpc"]')
            fi
            if echo "$CHANGED" | grep -q "^gke-platform/iam/"; then
              COMPONENTS=$(echo "$COMPONENTS" | jq -c '. + ["iam"]')
            fi
            if echo "$CHANGED" | grep -q "^gke-platform/gke/"; then
              COMPONENTS=$(echo "$COMPONENTS" | jq -c '. + ["gke"]')
            fi
          fi

          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Plan every changed root module in parallel. Safe to run concurrently -
  #    plan is read-only.
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: "Terraform Plan (${{ matrix.component }})"
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.components != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect_changes.outputs.components) }}
    defaults:
      run:
        working-directory: gke-platform/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_BACKEND_FILE }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -var-file=${{ env.TF_VAR_FILE }}

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ## Terraform Plan for `${{ matrix.component }}`
            ```
            ${{ steps.plan.outputs.stdout }}
            ```

  # ---------------------------------------------------------------------------
  # 3. Apply vpc/ and iam/ in parallel - neither depends on the other.
  # ---------------------------------------------------------------------------
  terraform-apply-vpc:
    name: "Terraform Apply (vpc)"
    needs: [detect_changes, terraform-plan]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(needs.detect_changes.outputs.components, 'vpc')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gke-platform/vpc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_BACKEND_FILE }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=${{ env.TF_VAR_FILE }}

  terraform-apply-iam:
    name: "Terraform Apply (iam)"
    needs: [detect_changes, terraform-plan]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(needs.detect_changes.outputs.components, 'iam')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gke-platform/iam
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_BACKEND_FILE }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=${{ env.TF_VAR_FILE }}

  # ---------------------------------------------------------------------------
  # 4. Apply gke/ LAST - it reads vpc/ and iam/ state via terraform_remote_state,
  #    so it must not run until both of those have finished applying (if they
  #    ran at all this pipeline). If vpc/iam weren't touched this run, their
  #    apply jobs are skipped - that's fine, we only need them to not have
  #    failed.
  # ---------------------------------------------------------------------------
  terraform-apply-gke:
    name: "Terraform Apply (gke)"
    needs: [detect_changes, terraform-plan, terraform-apply-vpc, terraform-apply-iam]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      contains(needs.detect_changes.outputs.components, 'gke') &&
      (needs.terraform-apply-vpc.result == 'success' || needs.terraform-apply-vpc.result == 'skipped') &&
      (needs.terraform-apply-iam.result == 'success' || needs.terraform-apply-iam.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gke-platform/gke
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_BACKEND_FILE }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=${{ env.TF_VAR_FILE }}
